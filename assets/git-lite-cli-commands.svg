<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">git-lite-cli command overview</title>
  <desc id="d">Five git-lite-cli commands: save, sync, undo, recover and doctor, each with a one-line description.</desc>
  <rect x="0.5" y="0.5" width="799" height="259" rx="12" fill="#0d1117" stroke="#30363d"/>
  <path d="M0.5 12.5a12 12 0 0 1 12-12h775a12 12 0 0 1 12 12V40H0.5z" fill="#161b22" stroke="#30363d"/>
  <circle cx="24" cy="21" r="5.5" fill="#ff5f56"/>
  <circle cx="44" cy="21" r="5.5" fill="#ffbd2e"/>
  <circle cx="64" cy="21" r="5.5" fill="#27c93f"/>
  <text x="400" y="25" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">git-lite-cli</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <text x="24" y="82"  fill="#3fb950">$</text><text x="44" y="82"  fill="#e6edf3">glc save -m "fix login bug"</text><text x="400" y="82"  fill="#8b949e"># stage and commit changes</text>
    <text x="24" y="112" fill="#3fb950">$</text><text x="44" y="112" fill="#e6edf3">glc sync</text><text x="400" y="112" fill="#8b949e"># pull latest changes, push yours</text>
    <text x="24" y="142" fill="#3fb950">$</text><text x="44" y="142" fill="#e6edf3">glc undo</text><text x="400" y="142" fill="#8b949e"># undo last commit or revert files</text>
    <text x="24" y="172" fill="#3fb950">$</text><text x="44" y="172" fill="#e6edf3">glc recover --all</text><text x="400" y="172" fill="#8b949e"># try to recover deleted files</text>
    <text x="24" y="202" fill="#3fb950">$</text><text x="44" y="202" fill="#e6edf3">glc doctor</text><text x="400" y="202" fill="#8b949e"># check the repository for problems</text>
  </g>
  <text x="24" y="238" fill="#8b949e" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">Also available as git-lite-cli &lt;command&gt;. Install: npm install -g git-lite-cli</text>
</svg>
