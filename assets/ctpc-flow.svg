<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" width="800" height="230" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">ctpc encrypt and decrypt flow</title>
  <desc id="d">Input directory, file selection by type or name, password-based encryption, encrypted output with folder structure preserved.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="799" height="229" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="24" y="34" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">ctpc / encrypt flow</text>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="20" y="60" width="160" height="80" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="100" y="94" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Input directory</text>
    <text x="100" y="116" text-anchor="middle" fill="#8b949e" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">--input  --nested</text>

    <rect x="220" y="60" width="160" height="80" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="300" y="94" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Select files</text>
    <text x="300" y="116" text-anchor="middle" fill="#8b949e" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">--type  --file</text>

    <rect x="420" y="60" width="160" height="80" rx="8" fill="#161b22" stroke="#58a6ff"/>
    <text x="500" y="94" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Encrypt</text>
    <text x="500" y="116" text-anchor="middle" fill="#8b949e" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">password-based</text>

    <rect x="620" y="60" width="160" height="80" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="700" y="94" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Output</text>
    <text x="700" y="116" text-anchor="middle" fill="#8b949e" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">*.enc  structure kept</text>

    <text x="24" y="180" fill="#8b949e" font-size="13">ctpc decrypt reverses the process: .enc files back into ./decrypted.</text>
    <text x="24" y="202" fill="#8b949e" font-size="13">Every run ends with a summary: files processed, data size, duration, throughput.</text>
  </g>

  <g stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)">
    <line x1="182" y1="100" x2="216" y2="100" marker-end="url(#a)"/>
    <line x1="382" y1="100" x2="416" y2="100" marker-end="url(#a)"/>
    <line x1="582" y1="100" x2="616" y2="100" marker-end="url(#a)"/>
  </g>
</svg>
