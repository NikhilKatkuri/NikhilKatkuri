<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" width="1100" height="900" role="img" aria-labelledby="t d">
  <title id="t">Express.js / Node Server Architecture</title>
  <desc id="d">HTTP requests flow through an Express.js Node server, global middleware, domain validation, modular business logic, and the database schema layer.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#8b949e"/>
    </marker>
    <style>
      .title{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#e6edf3}
      .label{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#e6edf3}
      .mono{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e}
      .small{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e}
      .card{fill:#161b22;stroke:#30363d;stroke-width:1}
      .accent{fill:#161b22;stroke:#58a6ff;stroke-width:1.5}
      .line{stroke:#8b949e;stroke-width:1.5;fill:none}
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1099" height="899" rx="16" fill="#0d1117" stroke="#30363d"/>

  <text x="48" y="45" class="mono">paperwork / server architecture</text>
  <text x="48" y="76" class="title">Express.js / Node request pipeline</text>

  <!-- Client -->
  <rect x="250" y="105" width="600" height="58" rx="10" class="card"/>
  <text x="550" y="131" text-anchor="middle" class="title">HTTP Requests / API Clients</text>
  <text x="550" y="151" text-anchor="middle" class="mono">mobile app · admin client · external API consumers</text>

  <line x1="550" y1="163" x2="550" y2="190" class="line" marker-end="url(#arrow)"/>

  <!-- App -->
  <rect x="190" y="192" width="720" height="72" rx="10" class="accent"/>
  <text x="550" y="220" text-anchor="middle" class="title">Express.js / Node Server</text>
  <text x="550" y="243" text-anchor="middle" class="mono">src/app.ts · application entry point</text>

  <line x1="550" y1="264" x2="550" y2="292" class="line" marker-end="url(#arrow)"/>

  <!-- Global middleware -->
  <rect x="100" y="294" width="900" height="82" rx="10" class="card"/>
  <text x="130" y="320" class="label">01 · Global Middleware Pipeline</text>
  <text x="130" y="346" class="mono">CORS Configuration</text>
  <text x="520" y="346" class="mono">config/cors.ts</text>
  <text x="130" y="365" class="mono">Rate Limiting</text>
  <text x="520" y="365" class="mono">config/rateLimit.ts</text>

  <line x1="550" y1="376" x2="550" y2="404" class="line" marker-end="url(#arrow)"/>

  <!-- Validation -->
  <rect x="100" y="406" width="900" height="82" rx="10" class="card"/>
  <text x="130" y="432" class="label">02 · Domain Validation &amp; Security</text>
  <text x="130" y="459" class="mono">Disposable Email Validator</text>
  <text x="520" y="459" class="mono">data/disposable-domains.json</text>
  <text x="130" y="477" class="small">Reject invalid / disposable addresses before business logic.</text>

  <line x1="550" y1="488" x2="550" y2="516" class="line" marker-end="url(#arrow)"/>

  <!-- Business logic -->
  <rect x="70" y="518" width="960" height="230" rx="12" class="card"/>
  <text x="100" y="547" class="label">03 · Modular Business Logic &amp; Route Handlers</text>

  <!-- Auth column -->
  <rect x="100" y="568" width="420" height="150" rx="9" fill="#0d1117" stroke="#30363d"/>
  <text x="125" y="594" class="label">Auth Core Module</text>
  <text x="125" y="613" class="small">docs/AUTH.README.MD</text>
  <line x1="125" y1="626" x2="495" y2="626" stroke="#30363d"/>
  <text x="125" y="650" class="mono">Email / Password Flow &amp; 2FA</text>
  <text x="125" y="676" class="mono">JWT Session Engine &amp; Tokens</text>

  <!-- Forms column -->
  <rect x="580" y="568" width="420" height="150" rx="9" fill="#0d1117" stroke="#30363d"/>
  <text x="605" y="594" class="label">Form Management Core</text>
  <text x="605" y="613" class="small">docs/FORMS.README.MD</text>
  <line x1="605" y1="626" x2="975" y2="626" stroke="#30363d"/>
  <text x="605" y="650" class="mono">Form &amp; Question Engines</text>
  <text x="605" y="676" class="mono">Form Sections Pipeline</text>
  <text x="605" y="702" class="mono">Response &amp; Submission Flow</text>

  <line x1="550" y1="748" x2="550" y2="776" class="line" marker-end="url(#arrow)"/>

  <!-- Database -->
  <rect x="190" y="778" width="720" height="72" rx="10" class="card"/>
  <text x="550" y="806" text-anchor="middle" class="title">Database &amp; Schema Layer</text>
  <text x="550" y="829" text-anchor="middle" class="mono">docs/SCHEMA.README.MD</text>

  <!-- footer -->
  <text x="550" y="878" text-anchor="middle" class="small">Request flow: clients → server → middleware → validation → business modules → database</text>
</svg>