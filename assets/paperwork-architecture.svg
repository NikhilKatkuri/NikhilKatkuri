<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" width="800" height="270" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">paperwork local architecture</title>
  <desc id="d">A web client talks to an API server, which uses MongoDB and Redis provided by Docker Compose.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="799" height="269" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="24" y="34" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">paperwork / local topology</text>

  <rect x="545" y="52" width="230" height="188" rx="10" fill="none" stroke="#30363d" stroke-dasharray="5 4"/>
  <text x="560" y="72" fill="#8b949e" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">docker-compose.yml</text>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="30" y="105" width="190" height="80" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="125" y="140" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Web client</text>
    <text x="125" y="162" text-anchor="middle" fill="#8b949e" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">client/frontend</text>

    <rect x="290" y="105" width="190" height="80" rx="8" fill="#161b22" stroke="#58a6ff"/>
    <text x="385" y="140" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">API server</text>
    <text x="385" y="162" text-anchor="middle" fill="#8b949e" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">server</text>

    <rect x="565" y="85" width="190" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="660" y="115" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">MongoDB 7</text>
    <text x="660" y="136" text-anchor="middle" fill="#8b949e" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">replica set rs0</text>

    <rect x="565" y="165" width="190" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="660" y="191" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Redis 8</text>
    <text x="660" y="211" text-anchor="middle" fill="#8b949e" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">append-only persistence</text>
  </g>

  <g stroke="#8b949e" stroke-width="1.5">
    <line x1="222" y1="145" x2="286" y2="145" marker-end="url(#a)"/>
    <line x1="482" y1="130" x2="561" y2="120" marker-end="url(#a)"/>
    <line x1="482" y1="160" x2="561" y2="192" marker-end="url(#a)"/>
  </g>

  <text x="24" y="258" fill="#8b949e" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">Compose provides MongoDB and Redis for local development.</text>
</svg>
